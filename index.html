
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake | Arcade</title>
<style>
:root {
  color-scheme: dark;
  --neon: #7cff6b;
  --bg: #090d12;
  --panel: #111923;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 24px 14px;
  background: radial-gradient(ellipse at top, #15251e, var(--bg) 65%);
  color: #eef5ef; font-family: system-ui, sans-serif;
  display: flex; justify-content: center;
}
main { width: min(100%, 440px); }
header { text-align: center; margin-bottom: 20px; }
h1 { margin: 0; font-size: 2rem; letter-spacing: 3px; }
h1 span { color: var(--neon); }
header p { color: #91a29a; font-size: .9rem; }
.stats { display: flex; gap: 12px; margin-bottom: 12px; }
.stat {
  flex: 1; padding: 12px; text-align: center;
  background: var(--panel); border: 1px solid #28352f;
  border-radius: 12px;
}
.stat small { display: block; color: #91a29a; }
.stat strong { font-size: 1.35rem; color: var(--neon); }
.board {
  padding: 8px; background: var(--panel);
  border: 1px solid #34443a; border-radius: 16px;
  box-shadow: 0 0 28px #7cff6b0d;
}
canvas {
  display: block; width: 100%; height: auto;
  border-radius: 9px; background: #080d11;
  touch-action: none;
}
.status { min-height: 24px; text-align: center; color: #b3c3b8; margin: 12px 0; }
.actions { display: flex; gap: 10px; }
button {
  border: 1px solid #3c5942; border-radius: 10px;
  background: #18251c; color: var(--neon);
  padding: 12px; font: inherit; font-weight: 700;
  cursor: pointer;
}
.actions button { flex: 1; }
button:active { transform: scale(.97); }
.controls {
  width: 190px; margin: 18px auto 0;
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}
.controls button { font-size: 1.2rem; padding: 12px 0; }
.controls .empty { visibility: hidden; }
footer { color: #788980; font-size: .8rem; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<main>
<header>
  <h1>NEON <span>SNAKE</span></h1>
  <p>A classic arcade game. Chase the glow.</p>
</header>

<section class="stats">
  <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
  <div class="stat"><small>BEST THIS VISIT</small><strong id="best">0</strong></div>
</section>

<div class="board">
  <canvas id="game" width="360" height="360" aria-label="Snake game board"></canvas>
</div>
<p class="status" id="status">Press Start to play</p>

<div class="actions">
  <button id="start">▶ Start Game</button>
  <button id="restart">↻ Restart</button>
</div>

<div class="controls" aria-label="Touch controls">
  <span class="empty"></span><button data-dir="up" aria-label="Up">▲</button><span class="empty"></span>
  <button data-dir="left" aria-label="Left">◀</button>
  <button data-dir="down" aria-label="Down">▼</button>
  <button data-dir="right" aria-label="Right">▶</button>
</div>
<footer>Use arrow keys or touch controls · Eat green food · Avoid walls and yourself</footer>
</main>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start");
const size = 18;
const cells = canvas.width / size;

let snake, food, direction, nextDirection, score, best = 0;
let running = false, ended = false, timer = null;

function reset() {
  clearInterval(timer);
  snake = [{x: 6, y: 10}, {x: 5, y: 10}, {x: 4, y: 10}];
  direction = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};
  score = 0;
  running = false;
  ended = false;
  scoreEl.textContent = "0";
  statusEl.textContent = "Ready? Press Start!";
  startBtn.textContent = "▶ Start Game";
  placeFood();
  draw();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * cells),
      y: Math.floor(Math.random() * cells)
    };
  } while (snake.some(part => part.x === food.x && part.y === food.y));
}

function draw() {
  ctx.fillStyle = "#080d11";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#15221b";
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= cells; i++) {
    ctx.beginPath();
    ctx.moveTo(i * size, 0);
    ctx.lineTo(i * size, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * size);
    ctx.lineTo(canvas.width, i * size);
    ctx.stroke();
  }

  ctx.fillStyle = "#ff647c";
  ctx.shadowColor = "#ff647c";
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(food.x * size + size/2, food.y * size + size/2, size * .32, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  snake.forEach((part, i) => {
    ctx.fillStyle = i === 0 ? "#b4ff9b" : "#57d96a";
    ctx.shadowColor = "#57d96a";
    ctx.shadowBlur = i === 0 ? 12 : 4;
    ctx.beginPath();
    ctx.roundRect(part.x * size + 2, part.y * size + 2, size - 4, size - 4, 5);
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  if (!running) {
    ctx.fillStyle = "#080d11bb";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#b4ff9b";
    ctx.font = "bold 20px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(ended ? "GAME OVER" : "NEON SNAKE", 180, 170);
    ctx.fillStyle = "#d0dcd3";
    ctx.font = "13px system-ui";
    ctx.fillText(ended ? "Tap Restart to try again" : "Press Start to begin", 180, 195);
  }
}

function tick() {
  direction = nextDirection;
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };
  const eating = head.x === food.x && head.y === food.y;

  if (
    head.x < 0 || head.x >= cells ||
    head.y < 0 || head.y >= cells ||
    snake.slice(0, eating ? undefined : -1)
      .some(part => part.x === head.x && part.y === head.y)
  ) {
    running = false;
    ended = true;
    clearInterval(timer);
    startBtn.textContent = "▶ Play Again";
    statusEl.textContent = `Game over! Final score: ${score}`;
    draw();
    return;
  }

  snake.unshift(head);
  if (eating) {
    score += 10;
    scoreEl.textContent = score;
    best = Math.max(best, score);
    bestEl.textContent = best;
    placeFood();
    if (score % 50 === 0) {
      clearInterval(timer);
      timer = setInterval(tick, Math.max(65, 140 - score));
    }
  } else {
    snake.pop();
  }
  draw();
}

function startGame() {
  if (running) return;
  if (ended) reset();
  running = true;
  ended = false;
  statusEl.textContent = "Good luck! Keep going.";
  startBtn.textContent = "▶ Playing";
  clearInterval(timer);
  timer = setInterval(tick, Math.max(65, 140 - score));
  draw();
}

function changeDirection(name) {
  const dirs = {
    up: {x: 0, y: -1}, down: {x: 0, y: 1},
    left: {x: -1, y: 0}, right: {x: 1, y: 0}
  };
  const d = dirs[name];
  if (!d || (d.x === -direction.x && d.y === -direction.y)) return;
  nextDirection = d;
}

document.addEventListener("keydown", event => {
  const keys = {
    ArrowUp: "up", ArrowDown: "down",
    ArrowLeft: "left", ArrowRight: "right"
  };
  if (keys[event.key]) {
    event.preventDefault();
    changeDirection(keys[event.key]);
    if (!running && !ended) startGame();
  }
});

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("click", () => {
    changeDirection(button.dataset.dir);
    if (!running && !ended) startGame();
  });
});

let touchStart = null;
canvas.addEventListener("touchstart", event => {
  const t = event.changedTouches[0];
  touchStart = {x: t.clientX, y: t.clientY};
}, {passive: true});

canvas.addEventListener("touchend", event => {
  if (!touchStart) return;
  const t = event.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
    changeDirection(Math.abs(dx) > Math.abs(dy)
      ? (dx > 0 ? "right" : "left")
      : (dy > 0 ? "down" : "up"));
    if (!running && !ended) startGame();
  }
  touchStart = null;
}, {passive: true});

startBtn.addEventListener("click", startGame);
document.getElementById("restart").addEventListener("click", reset);

reset();
</script>
</body>
</html>
